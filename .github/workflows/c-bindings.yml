name: C bindings

# Builds the C library in bindings/c on Linux (x86-64, ARM64), macOS (ARM64,
# x86-64) and Windows x86-64, checks the committed header, runs the C tests,
# builds and runs the example against the installed CMake and pkg-config
# package and against the static library, and packages the header, both
# libraries and the notices into an archive. On Windows the CMake package and
# the pkg-config file are not built or tested (see the step that skips them),
# and the example and the tests are compiled with cl.exe directly.
# When a GitHub release is published it attaches the archives to it. The
# packaging runs on every trigger, so it is proven working before a release
# needs it.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the archives for and attach them to
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Before anything is built: the archive tag, and one version across the
  # crate and the bindings, which a release tag must name. A pull request's
  # ref name has a slash in it, which breaks a directory name below, so
  # "dev" stands in for anything that is not a release tag. The dispatch
  # input reaches the script through the environment rather than `${{ }}`,
  # which would paste it into the shell.
  versions:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is-release: ${{ steps.tag.outputs.is-release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || '' }}
      - name: Determine the archive tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"; is_release=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"; is_release=true
          else
            tag=dev; is_release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is-release=$is_release" >> "$GITHUB_OUTPUT"
      - name: Check the release metadata
        env:
          TAG: ${{ steps.tag.outputs.is-release == 'true' && steps.tag.outputs.tag || '' }}
        run: python3 .github/scripts/check_release.py --release-tag "$TAG"

  c-bindings:
    needs: versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `target` is not passed to cargo, since the runner's default
        # toolchain already builds for it; it only names the archive.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.versions.outputs.tag }}
      IS_RELEASE: ${{ needs.versions.outputs.is-release }}
    defaults:
      run:
        shell: bash
    steps:
      # A tag input checks out that tag, so a run by hand builds and attaches
      # the archives a published release lacks.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || '' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # check.py needs CMake and pkg-config, which the ARM64 image may lack.
      - name: Install CMake and pkg-config
        if: runner.os == 'Linux'
        run: |
          if ! command -v cmake || ! command -v pkg-config; then
            sudo apt-get update && sudo apt-get install -y cmake pkg-config
          fi

      # The header against cbindgen's, the CMake build and its tests (the
      # answers of a dozen ProbLog system tests, and the example), the
      # installation, and the example built against the installed package
      # through CMake and pkg-config.
      #
      # Not on Windows: the CMake package links `m`, names no import library
      # for the DLL and installs the DLL beside the others in lib, and
      # pkg-config is not installed there. The steps below build, run and
      # package the Windows library without CMake.
      - name: Build, test and install
        if: runner.os != 'Windows'
        run: python3 bindings/c/check.py

      # Builds the static library as well, and prints the system libraries a
      # static link has to name, the C++ runtime of goatd's vendored solvers
      # among them. The example's static link uses that list rather than a
      # guess per platform.
      - name: Build the libraries
        working-directory: bindings/c
        env:
          # The note below is read by sed, and colour escapes would hide it.
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo rustc --release -- --print native-static-libs 2>&1 \
            | tee "$RUNNER_TEMP/build.log"
          libs=$(sed -n 's/^note: native-static-libs: //p' "$RUNNER_TEMP/build.log" | head -n 1)
          test -n "$libs" || { echo "rustc printed no native-static-libs note"; exit 1; }
          echo "NATIVE_STATIC_LIBS=$libs" >> "$GITHUB_ENV"

      - name: Build and run the example against the static library
        if: runner.os != 'Windows'
        run: |
          set -eux
          # The list of libraries is split into words on purpose.
          # shellcheck disable=SC2086
          cc -std=c11 -Wall -Wextra -Werror -Ibindings/c/include \
             bindings/c/examples/alarm.c bindings/c/target/release/libtddlog_c.a \
             $NATIVE_STATIC_LIBS -lm -o alarm-static
          ./alarm-static

      # cl.exe is not on PATH until vcvars has run, and vswhere finds the
      # installation without naming the Visual Studio edition. /MD is the
      # dynamic C runtime that Rust and the vendored C++ are built against.
      # The tests take the same programs as the CMake test `answers`
      # (bindings/c/CMakeLists.txt). `-D_CRT_SECURE_NO_WARNINGS` silences
      # MSVC's notes on fopen, which the tests use.
      - name: Build and run the example and the tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set OUT=bindings\c\target\release
          copy %OUT%\tddlog_c.dll . || exit /b 1

          cl /nologo /std:c11 /MD /W3 /D_CRT_SECURE_NO_WARNINGS /Ibindings\c\include ^
             bindings\c\examples\alarm.c /Fe:alarm-shared.exe /link %OUT%\tddlog_c.dll.lib || exit /b 1
          alarm-shared.exe || exit /b 1

          cl /nologo /std:c11 /MD /W3 /D_CRT_SECURE_NO_WARNINGS /Ibindings\c\include ^
             bindings\c\examples\alarm.c /Fe:alarm-static.exe /link %OUT%\tddlog_c.lib %NATIVE_STATIC_LIBS% || exit /b 1
          alarm-static.exe || exit /b 1

          cl /nologo /std:c11 /MD /W3 /D_CRT_SECURE_NO_WARNINGS /Ibindings\c\include ^
             bindings\c\tests\answers.c /Fe:answers.exe /link %OUT%\tddlog_c.dll.lib || exit /b 1
          set P=tests/problog
          answers.exe %P%/00_trivial_and.pl %P%/00_trivial_not.pl %P%/00_trivial_or.pl %P%/10_cards.pl ^
             %P%/11_ads_numerical.pl %P%/3_tossing_coin.pl %P%/4_bayesian_net.pl ^
             %P%/7_probabilistic_graph.pl %P%/8_smokers_network.pl %P%/add.pl %P%/negation.pl ^
             %P%/negative_query.pl %P%/smokers_or.pl %P%/tc_3.pl || exit /b 1

      - name: Check formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: bindings/c
        run: cargo fmt --check

      - name: Lint
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: bindings/c
        run: cargo clippy --release -- -D warnings

      # The archive is the installation check.py tested from another prefix:
      # the header in include/, the shared library, the CMake package and the
      # pkg-config file in lib/, and LICENSE, NOTICE and THIRD-PARTY.md in
      # share/licenses/tddlog (goatd's vendored solvers are BSD-2-Clause and
      # MIT, and their notices have to accompany the libraries they are
      # compiled into). The static library goes beside the shared one, and
      # NATIVE-STATIC-LIBS.txt records the system libraries it needs at link
      # time, which differ per platform.
      - name: Package the archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -eux
          name="tddlog-c-$TAG-${{ matrix.target }}"
          cp -R bindings/c/build/package "$name"
          cp bindings/c/target/release/libtddlog_c.a "$name/lib/"
          {
            echo "System libraries needed when linking libtddlog_c.a statically,"
            echo "from 'cargo rustc --release -- --print native-static-libs':"
            echo "$NATIVE_STATIC_LIBS"
          } > "$name/NATIVE-STATIC-LIBS.txt"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          tar tzf "$name.tar.gz"

      # MSVC names the DLL's import library tddlog_c.dll.lib, and the static
      # archive tddlog_c.lib. A zip, which Windows opens without extra tools.
      - name: Package the archive (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eux
          out=bindings/c/target/release
          name="tddlog-c-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp bindings/c/include/tddlog.h LICENSE NOTICE THIRD-PARTY.md "$name"
          cp "$out/tddlog_c.dll" "$out/tddlog_c.dll.lib" "$out/tddlog_c.lib" "$name"
          {
            echo "System libraries needed when linking tddlog_c.lib statically,"
            echo "from 'cargo rustc --release -- --print native-static-libs':"
            echo "$NATIVE_STATIC_LIBS"
          } > "$name/NATIVE-STATIC-LIBS.txt"
          7z a "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          7z l "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tddlog-c-${{ matrix.target }}
          path: |
            tddlog-c-*.tar.gz*
            tddlog-c-*.zip*

      # No --clobber: an archive attached to a published release, and the
      # checksum people verify it against, are never replaced. To rebuild one,
      # delete it from the release and run this workflow with the tag.
      - name: Attach to the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" tddlog-c-"$TAG"-${{ matrix.target }}.*
