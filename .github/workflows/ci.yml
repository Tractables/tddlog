name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test --profile quick --locked
      - run: cargo run --profile quick --locked --example sprinkler
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # A Python of its own for pip, as the other workflows set up.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Check the release metadata
        run: python .github/scripts/check_release.py
      - run: python -m unittest discover -s tests -p 'test_*.py'

  # The README promises Rust 1.88 or newer (Cargo.toml's rust-version);
  # the job above runs the latest stable.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets --locked
