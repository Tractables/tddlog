name: Wheels

# Builds the Python extension in bindings/python for Linux (x86-64, ARM64),
# macOS (ARM64, x86-64) and Windows x86-64, runs the Python tests against each
# wheel, and uploads the wheels and the source distribution as run artifacts.
# When a GitHub release is published it builds them from the release tag and
# publishes them to PyPI; a run by hand only builds and tests.

on:
  release:
    types: [published]
  pull_request:
    # The bindings build the solver from this checkout, so a change to the
    # solver can break them and has to run these jobs.
    paths:
      - "bindings/python/**"
      - ".github/scripts/check_release.py"
      - "src/**"
      - "tests/problog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: 1.15.0

jobs:
  # A tag naming a version the crates do not carry would build a wheel
  # labelled with the previous release and publish it under that label, which
  # PyPI will not let anyone replace. Check before anything is built.
  versions:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/check_release.py --release-tag "$TAG"

  wheels:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # A wheel built on the runner itself would need the runner's glibc
            # to run. The manylinux image fixes the oldest glibc the extension
            # is built against, and maturin runs auditwheel over the result.
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: /opt/python/cp310-cp310/bin/python
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: /opt/python/cp310-cp310/bin/python
          - os: macos-latest
            target: aarch64-apple-darwin
            python: python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            python: python
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The manylinux image carries the CPython builds and a C++20 gcc for
      # goatd's vendored solvers, but no Rust and no maturin on PATH.
      - name: Install Rust in the container
        if: matrix.container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable -c rustfmt -c clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          dirname "$PYTHON" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v6
        if: matrix.container == ''
        with:
          python-version: "3.10"

      # PEP 639 resolves `license-files` against the directory holding
      # pyproject.toml and rejects paths that leave it, so the notices are
      # copied in here instead of being kept in a second tracked copy. The
      # extension compiles goatd's vendored C++ in: THIRD-PARTY.md carries
      # the BSD-2-Clause and MIT notices that have to travel with it.
      - name: Collect the license and the notices
        run: mkdir -p bindings/python/notices && cp LICENSE NOTICE THIRD-PARTY.md bindings/python/notices/

      - name: Install maturin
        run: $PYTHON -m pip install --disable-pip-version-check "maturin==$MATURIN_VERSION"

      # Once, on Linux x86-64: neither depends on the platform, and the other
      # runners are here to build and test the wheel.
      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/python
        run: cargo fmt --check

      - name: Lint
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/python
        env:
          PYO3_PYTHON: ${{ matrix.python }}
        run: cargo clippy --release -- -D warnings

      # The extension uses the stable ABI, so this one wheel serves CPython
      # 3.10 and later.
      - name: Build the wheel
        working-directory: bindings/python
        run: maturin build --release --out dist --interpreter "$PYTHON"

      - name: Check what the wheel carries
        working-directory: bindings/python
        run: |
          wheel=$(ls dist/*.whl)
          echo "$wheel"
          $PYTHON -m zipfile --list "$wheel" | tee dist/contents.txt
          # maturin installs tddlog.pyi as the package's __init__.pyi, beside
          # the py.typed marker that makes a checker read it.
          for wanted in LICENSE NOTICE THIRD-PARTY.md py.typed __init__.pyi; do
            grep -q "$wanted" dist/contents.txt || { echo "$wanted is not in the wheel"; exit 1; }
          done

      # A wheel that builds is not yet known to work. Install it and check its
      # answers against ProbLog's on the runner before uploading anything.
      - name: Test the wheel
        working-directory: bindings/python
        run: |
          $PYTHON -m pip install --disable-pip-version-check pytest
          $PYTHON -m pip install --disable-pip-version-check --force-reinstall \
            --no-index --find-links dist tddlog
          $PYTHON -m pytest tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # A wheel exists only for the five platforms above. The source distribution
  # is what pip falls back to everywhere else, and building it needs a Rust
  # toolchain and a C++20 compiler, which the README says.
  sdist:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Collect the license and the notices
        run: mkdir -p bindings/python/notices && cp LICENSE NOTICE THIRD-PARTY.md bindings/python/notices/

      - name: Install maturin
        run: python -m pip install --disable-pip-version-check "maturin==$MATURIN_VERSION"

      - name: Build the source distribution
        working-directory: bindings/python
        run: maturin sdist --out dist

      # A source distribution that does not build is worse than none, since
      # pip falls back to it and fails there instead of at the index. Build it
      # the way a consumer would and run the tests against the result.
      - name: Install from the source distribution and test
        working-directory: bindings/python
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check dist/*.tar.gz
          python -m pytest tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  # Only for a published release, and only once every wheel has been built and
  # tested. Trusted publishing means GitHub proves this workflow's identity to
  # PyPI with a short-lived token, so no API token is stored in the
  # repository; the `pypi` environment is where a required reviewer goes,
  # since an upload can be yanked but never withdrawn.
  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.2
