<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tddlog: not found</title>
<script>
// The site's page for an address it does not have. A benchmark's page was
// once a file of its own (results/benchmarks/SUITE/NAME.html); it is now a
// view of the results page, where a link to the old address is sent.
(() => {
  const m = location.pathname.match(/^(.*\/)results\/benchmarks\/(?:([^/]+)\/([^/]+)\.html|index\.html)?$/);
  if (m) location.replace(`${m[1]}results/${m[2] ? `#/${m[2]}/@${encodeURIComponent(decodeURIComponent(m[3]))}` : ""}`);
})();
</script>
<style>
:root { color-scheme: light dark; --bg: #f5f5f2; --ink: #1d1f21; --muted: #6c7075; --accent: #2070a8; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181b; --ink: #e5e8ea; --muted: #9aa1a9; --accent: #6fb3e6; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
h1 { margin: 0 0 0.5rem; font-size: 1.35rem; font-weight: 600; }
p { color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Not found</h1>
<p>The site has no page at this address. Its pages are
<a data-to="">the playground</a>, <a data-to="guide/">the guide</a> and
<a data-to="results/">the results</a>.</p>
</main>
<script>
// The links lead to the site's root, wherever the site is served from.
const root = location.pathname.startsWith("/tddlog/") ? "/tddlog/" : "/";
for (const a of document.querySelectorAll("a[data-to]")) a.href = root + a.dataset.to;
</script>
</body>
</html>
