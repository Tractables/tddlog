[package]
name = "tddlog-wasm"
version = "0.1.0"
authors = ["Guy Van den Broeck"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tddlog"
description = "tddlog built for the browser with Emscripten: a ProbLog program goes in, its answers come out."
publish = false

# An empty workspace table keeps this crate out of the tddlog package above
# it, so it is built on its own.
[workspace]

# Emscripten links a program, not a library: a cdylib for this target is a
# side module, which the page cannot load on its own. The binary's `main` does
# nothing and never runs; the page calls the exported functions. The output
# files are named after this binary, so the page loads tddlog.js.
[[bin]]
name = "tddlog"
path = "src/main.rs"

[dependencies]
# The checkout this crate sits in, so a change to the solver is built through
# the page before it is published.
tddlog = { path = "../.." }

# As the command line's release build: the solver's hot loops are inlined
# across crates.
[profile.release]
lto = "fat"
codegen-units = 1
