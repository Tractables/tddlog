<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tddlog results</title>
<meta name="description" content="tddlog's release run against the systems people use for logic programs, Bayesian and Markov networks, probabilistic databases and probabilistic programs: each kind of problem, each suite and each benchmark, with its runs and, where they were captured, its programs.">
<script src="../theme.js"></script>
<link rel="stylesheet" href="../styles.css">
</head>
<body class="results">

<main>

<header>
  <div>
    <h1 class="unseen">tddlog results</h1>
  </div>
  <nav class="site-nav" aria-label="Site">
    <a href="../">Playground</a>
    <a href="../guide/">Guide</a>
    <a href="./" aria-current="page">Results</a>
    <a href="../api/">Rust API</a>
    <a href="../python/">Python</a>
    <a href="../c/">C</a>
    <a href="https://github.com/Tractables/tddlog">GitHub</a>
    <button id="theme" type="button" aria-label="Switch to the dark theme">Dark</button>
  </nav>
</header>

<div class="shell">
  <aside id="rail" aria-label="Browse the results">
    <button id="browse" class="plain" type="button" aria-expanded="false" aria-controls="tree">Browse the results</button>
    <input id="search" type="search" placeholder="Find a suite, system or instance" aria-label="Find a kind, suite, family, system or instance by its name"
      autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="found-list" aria-expanded="false">
    <div id="found"><p id="found-n" class="n" aria-live="polite"></p><ul id="found-list" role="listbox" aria-label="Found"></ul></div>
    <nav id="tree" aria-label="Kinds, suites and families"></nav>
  </aside>
  <div id="view">
    <p class="note">Loading the results…</p>
    <noscript><p class="note">The plots and tables of this page need
    JavaScript; the same results are in
    <a href="https://github.com/Tractables/tddlog/blob/baselines/docs/benchmarks.md">docs/benchmarks.md</a>
    on the baselines branch.</p></noscript>
  </div>
</div>

<div id="drawer" role="dialog" aria-labelledby="drawer-title" hidden></div>

<footer>
  tddlog is open source under the Apache-2.0 license:
  <a href="https://github.com/Tractables/tddlog">repository</a> ·
  <a href="https://github.com/Tractables/tididi">tididi</a>, the TDD library ·
  <a href="https://github.com/Tractables/goatd">goatd</a>, its tree decompositions ·
  <a href="https://github.com/Tractables/tddlog/tree/baselines">the baselines' scripts and programs</a>
</footer>

</main>

<script src="../code.js"></script>
<script src="results.js"></script>

</body>
</html>
