# An empty `[workspace]` table keeps this crate out of any workspace cargo
# would otherwise infer from the directories above it, so it is built on its
# own.
[workspace]

[package]
name = "tddlog-c"
version = "0.1.0"
authors = ["Guy Van den Broeck"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tddlog"
description = "C bindings for tddlog."
# Nothing here goes to crates.io; the artifacts are the shared and static
# libraries a C or C++ program links against.
publish = false

[lib]
name = "tddlog_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The checkout this crate sits in, so the library answers as the command line
# built from the same commit does. `tddlog_version` reports this package's
# version, which is kept equal to the solver's.
tddlog = { path = "../.." }

[build-dependencies]
# Writes the header from src/lib.rs on every build; check.py compares it with
# the committed include/tddlog.h.
cbindgen = "0.29"

# The command line's release profile: the solver runs as fast in the library.
[profile.release]
lto = "fat"
codegen-units = 1
