[package]
name = "tddlog"
version = "0.1.0"
authors = ["Guy Van den Broeck"]
edition = "2024"
rust-version = "1.88"
description = "Exact probabilistic inference by compilation into tree decision diagrams"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tddlog"
homepage = "https://tractables.github.io/tddlog/"
documentation = "https://tractables.github.io/tddlog/api/tddlog/"
readme = "README.md"
keywords = ["problog", "probabilistic", "logic-programming", "decision-diagram", "inference"]
categories = ["science", "command-line-utilities"]

[dependencies]
# The TDD library.
tididi = { git = "https://github.com/Tractables/tididi", rev = "8ff4cae594760bc8707a5976e74bd6c97e70cb84" }
# Tree decompositions for the structure-aware vtree strategies. Its build.rs
# compiles a vendored C++ FlowCutter, so building needs a C++ compiler.
goatd = { git = "https://github.com/Tractables/goatd", rev = "e592d1e2233d4f724c6cb3475a4810d95e0b847a" }
rustc-hash = "2"
# Exact weights for the sum-out's weight store (`src/query/sum_out.rs`), as
# tididi's `RationalWeights` takes them.
num-rational = "0.4"
# The rounding of an exact ratio to a float (`ToPrimitive::to_f64`), as the
# Dice reader takes a flip's probability from exact sums (`src/syntax/dice.rs`).
num-traits = "0.2"

# The binary's allocator (`src/bin/tddlog/alloc.rs`), its purge (`mallctl`,
# from the jemalloc that tikv-jemallocator links), and the switch of its huge
# pages. The library uses none of them. For WebAssembly (`bindings/wasm`)
# only the library is built, and jemalloc does not build with MSVC, so the
# binary uses the system allocator there.
[target.'cfg(not(any(target_family = "wasm", target_env = "msvc")))'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-sys = "0.6.1"
libc = "0.2"

# Line tables (debug = 1) let a profile name source lines; they change
# neither the code nor its speed, only the binary's size.
[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

# Release without link-time optimization, for correctness tests and count
# runs (`cargo test --profile quick`). Answers and work units are the same as
# release; timings come only from release builds.
[profile.quick]
inherits = "release"
debug = 0
lto = false
codegen-units = 16
incremental = true
